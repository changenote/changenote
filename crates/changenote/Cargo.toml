[package]
name = "changenote"
version = "0.13.1"
edition = "2024"
description = "Language-independent change notes and releases"
license = "MIT"
readme = "README.md"
# Include hidden change-note fixtures and self-contained package resources.
include = [
    "src/**",
    "tests/**",
    "SKILL.md",
    "docs/notes.md",
    "docs/swift.md",
    "schema.json",
    "README.md",
    "LICENSE",
]

[dependencies]
changenote-core = { path = "../changenote-core" }
changenote-cli = { path = "../changenote-cli" }

[dev-dependencies]
anyhow = "1"
semver = { version = "1", features = ["serde"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
tempfile = "3"
