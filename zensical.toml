[project]
site_url = "https://changenote.github.io/changenote/"
site_name = "changenote"
site_description = "Turn Markdown change notes into SemVer versions, changelogs, and release tags."
# site_author = "Your name"

# copyright = "Copyright &copy; 2026 Your name"

repo_url = "https://github.com/changenote/changenote"
repo_name = "changenote/changenote"
# edit_uri = "edit/main/docs/"

nav = [
  { "Getting started" = [
    { "Quickstart" = "index.md" },
    { "Installation" = "installation.md" },
    { "Use with AI agents" = "agents.md" },
  ] },
  { "Guides" = [
    { "Write change notes" = "notes.md" },
    { "Release behavior" = "releases.md" },
    { "Check PR notes" = "checks.md" },
    { "GitHub Actions (external)" = "https://github.com/changenote/action/blob/main/docs/github-actions.md" },
  ] },
  { "Configuration" = [
    { "Package configuration" = "configuration.md" },
    { "Version sources" = "version-files.md" },
    { "Version groups" = "version-groups.md" },
    { "Lockfile synchronization" = "lockfiles.md" },
    { "Changelog configuration" = "changelogs.md" },
  ] },
  { "Integrations" = [
    { "Android apps" = "android.md" },
    { "Go modules" = "go.md" },
    { "Lean 4 packages" = "lean.md" },
    { "Swift packages and Apple apps" = "swift.md" },
  ] },
  { "Reference" = [
    { "CLI commands" = "commands.md" },
  ] },
  { "Maintainers" = [
    { "Development" = "development.md" },
    { "Maintainer releases" = "maintainer-releases.md" },
  ] },
]

# extra_css = ["stylesheets/extra.css"]
# extra_javascript = ["javascripts/extra.js"]

[project.theme]
# variant = "classic"
# custom_dir = "overrides"
# favicon = "images/favicon.png"
language = "en"
features = [
  "announce.dismiss",
  # "content.action.edit",
  # "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  # "header.autohide",
  # "navigation.expand",
  "navigation.footer",
  "navigation.instant",
  "navigation.instant.prefetch",
  # "navigation.instant.progress",
  "navigation.path",
  # "navigation.prune",
  "navigation.sections",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  # "toc.follow",
  # "toc.integrate",
]

# logo = "assets/logo.png"

# [project.theme.icon]
# logo = "lucide/smile"

# [project.theme.font]
# text = "Inter"
# code = "Jetbrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

# [[project.extra.social]]
# icon = "fontawesome/brands/github"
# link = "https://github.com/user/repo"

# [[project.extra.social]]
# icon = "fontawesome/brands/mastodon"
# link = "https://fosstodon.org/@user"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
# pymdownx.snippets.base_path = "includes"
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
