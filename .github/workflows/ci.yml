name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflows:
    name: workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.25'
      - name: Check workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.11
          "$(go env GOPATH)/bin/actionlint"
      - run: uv run --no-project --with pyyaml python -m unittest discover -s tests/workflows -v
      - run: uv run --no-project python -m unittest discover -s tests/publication -v
      - run: uv run --no-project python -m unittest discover -s tests/python_release -v

  python:
    name: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
      - run: uv sync --locked
      - run: uv run --locked python -m unittest discover -s python/tests
      - name: Build release source archive
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.16.0
          command: sdist
          args: --out dist/python-release
      - name: Check release source archive
        run: uv run --no-project python scripts/check_python_sdist.py dist/python-release/*.tar.gz
      - run: uv build --out-dir dist/python-binary
      - run: uv run --no-project python scripts/check_python_sdist.py dist/python-binary/*.tar.gz
      - run: uvx --isolated --no-index --find-links dist/python-binary changenote --help
      - name: Check out compatible Action tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: changenote/action
          ref: 9323bb6f0a1dfdae6124649e69bc90a990aab20c
          path: .verifications/action-compatibility
          persist-credentials: false
      - name: Verify Action compatibility with the built wheel
        working-directory: .verifications/action-compatibility
        run: |
          uv venv "$RUNNER_TEMP/changenote-compatibility"
          uv pip install --python "$RUNNER_TEMP/changenote-compatibility/bin/python" \
            --no-index --find-links "$GITHUB_WORKSPACE/dist/python-binary" changenote
          export PATH="$RUNNER_TEMP/changenote-compatibility/bin:$PATH"
          changenote --version
          sha256sum "$(command -v changenote)"
          uv run --no-project python -m unittest discover -s tests/actions -v
          uv run --no-project --with pyyaml python -m unittest discover -s tests/action_metadata -v

  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
      - name: Check crate archive
        run: |
          uv run --no-project python scripts/package_crate.py package --locked -p changenote
          archive=$(mktemp -d)
          trap 'rm -rf "$archive"' EXIT
          tar -xzf target/package/changenote-*.crate -C "$archive"
          CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" cargo test --locked --manifest-path "$archive"/changenote-*/Cargo.toml
      - run: cargo run --locked -p changenote -- status
